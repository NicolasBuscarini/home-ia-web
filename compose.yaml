services:
  verify:
    image: node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [verify]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
      CI: "true"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    command: sh -lc 'npm ci && npm run verify'

  ct02:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    profiles: [ct02]
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      CI: "true"
      CT02_BASE_URL: ${CT02_BASE_URL:-http://127.0.0.1:5173}
      CT02_USERNAME: ${CT02_USERNAME:-}
      CT02_PASSWORD: ${CT02_PASSWORD:-}
      CT02_DURATION_SECONDS: ${CT02_DURATION_SECONDS:-600}
    command: sh -lc 'npm ci && npm run test:ct02'

volumes:
  web_node_modules:
